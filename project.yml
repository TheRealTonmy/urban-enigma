name: TradeSense
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tradesense.app
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: TradeSense
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    ENABLE_PREVIEWS: YES
targets:
  TradeSense:
    type: application
    platform: iOS
    sources:
      - path: TradeSense
    settings:
      base:
        PRODUCT_NAME: TradeSense
