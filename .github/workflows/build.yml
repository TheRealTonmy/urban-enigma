
name: Build TradeSense IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '**.swift'
      - 'project.yml'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS
        run: |
          xcodebuild \
            -project TradeSense.xcodeproj \
            -scheme TradeSense \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TradeSense.app Payload/
          /usr/bin/zip -r TradeSense-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TradeSense-unsigned-ipa
          path: TradeSense-unsigned.ipa
